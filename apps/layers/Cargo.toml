[package]
name = "raea-app-layers"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "`raea export layers`: a composition as its layers (captions, graphics, footage, under, sound) and the timeline that places them, layers.json, which every editor's export is written from (docs/layers.feature LA4)"

[dependencies]
raea-runtime-bundle = { path = "../../runtime/bundle" }
raea-io-alpha = { path = "../../io/alpha" }
raea-io-media = { path = "../../io/media", default-features = false, features = ["soft-audio", "apple"] }
# the renderer's own lookup of a staticFile path (/media/x), so the export finds the files the render drew
raea-core-scene = { path = "../../core/scene" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
